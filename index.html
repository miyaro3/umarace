<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ミヤロカップ競馬ゲーム</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #222; color: white; font-family: "MS UI Gothic", sans-serif; 
            margin: 0; overflow: hidden; display: flex;
            width: 800px; height: 600px; 
        }
        
        /* ログイン画面 */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 800px; height: 600px;
            background: #333; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .config-group { 
            background: #444; padding: 20px; border-radius: 10px; 
            width: 380px; border: 1px solid #555;
        }
        .config-item { margin-bottom: 12px; display: flex; flex-direction: column; }
        .config-item label { font-size: 13px; margin-bottom: 4px; color: #bbb; font-weight: bold; }
        #login-screen input { 
            padding: 8px; font-size: 15px; border-radius: 4px; border: 1px solid #1a1a1a; 
            background: #1a1a1a; color: #fff; width: 100%;
        }
        .config-row { display: flex; gap: 10px; }
        .config-row .config-item { flex: 1; }
        #login-screen button {
            padding: 12px; font-size: 16px; cursor: pointer; background: #9146ff; 
            color: white; border: none; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 10px;
        }

        /* サイドバー */
        #sidebar { 
            width: 200px; background: #111; border-right: 2px solid #555; 
            height: 100%; overflow: hidden; display: flex; flex-direction: column; padding: 10px;
        }
        #user-list-container { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; }
        #controls-info { 
            font-size: 12px; line-height: 1.4; color: #fff; 
            background: rgba(50,50,50,0.9); padding: 10px; border: 2px solid #888; border-radius: 8px;
        }
        #controls-info strong { color: #ffff00; font-size: 14px; }

        /* メイン画面 */
        #main { flex-grow: 1; position: relative; background: #3a7d44; height: 100%; overflow: hidden; display: none; }
        
        /* コース */
        #track { 
            position: absolute; bottom: 0; width: 100%; height: 360px; 
            background-image: linear-gradient(#458b52 50%, #3a7d44 50%); background-size: 100% 44px;
            border-top: 3px solid #fff;
        }
        .lane { position: relative; height: 22px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .finish-line { 
            position: absolute; right: 50px; top: 0; width: 8px; height: 100%; 
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px); 
            z-index: 10;
        }

        /* 馬の配置 */
        .horse-container { 
            position: absolute; left: 0px; display: flex; flex-direction: row-reverse; 
            align-items: center; z-index: 100; width: 150px; 
        }
        .horse-name { font-size: 10px; white-space: nowrap; background: rgba(0,0,0,0.7); padding: 0 3px; border-radius: 2px; margin-left: 4px; }
        .horse-sprite { width: 22px; height: 22px; image-rendering: pixelated; }

        /* 枠色 */
        .waku-bg-1 { background-color: #ffffff; color: #000; } .waku-bg-2 { background-color: #000000; color: #fff; }
        .waku-bg-3 { background-color: #ff0000; color: #fff; } .waku-bg-4 { background-color: #0080ff; color: #fff; }
        .waku-bg-5 { background-color: #ffff00; color: #000; } .waku-bg-6 { background-color: #008000; color: #fff; }
        .waku-bg-7 { background-color: #ff8c00; color: #fff; } .waku-bg-8 { background-color: #ffc0cb; color: #000; }
        
        /* 電光掲示板 */
        #denko-board {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: #000; border: 3px solid #444; padding: 12px; z-index: 2000; display: none;
        }
        .led-row { 
            display: flex; justify-content: space-between; align-items: center;
            font-family: 'Courier New', monospace; color: #ff8800; font-size: 16px; 
            font-weight: bold; margin-bottom: 5px; border-bottom: 1px dashed #333;
        }
        .led-res-text { flex-grow: 1; display: flex; align-items: center; }
        .waku-small-badge { display: inline-block; width: 24px; text-align: center; border-radius: 3px; margin-right: 10px; font-size: 14px; }
        .led-prize { width: 110px; text-align: right; color: #ffff00; }
        #payout-list { color: #00ff00; font-size: 15px; margin-top: 10px; font-family: 'Courier New', monospace; }

        /* 順位表示 */
        #live-rank { margin-top: 5px; font-size: 12px; color: #fff; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; }
        .rank-tag { font-weight: bold; color: #00ff00; margin-right: 4px; }

        /* 待機エリア */
        #waiting-area { 
            position: absolute; top: 100px; left: 10px; width: 580px;
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
        }
        .waku-slot { border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); height: 110px; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        .waku-header { width: 100%; text-align: center; font-size: 10px; font-weight: bold; }
        .waku-odds-info { width: 100%; text-align: center; font-size: 12px; font-weight: bold; color: #ffff00; background: rgba(0,0,0,0.5); padding: 2px 0; }
        .waiting-unit { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 2px; }
        .waiting-name { font-size: 9px; text-align: center; width: 100%; overflow: hidden; }

        #timer-display { font-size: 18px; color: #ffff00; font-weight: bold; }
        #odds-display { display: none; }
        .user-row { border-bottom: 1px solid #333; padding: 4px 0; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        
        .vote-tag {
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 2px;
            margin-left: 2px;
            font-weight: bold;
            display: inline-block;
        }

        /* 設定追加用 */
        .config-checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #bbb; margin-top: 5px; }
        .config-checkbox-row input { width: auto !important; cursor: pointer; }

        /* イベント通知アニメーション */
        .event-pop {
            position: absolute; top: -20px; left: 20px; font-size: 10px; font-weight: bold;
            color: #ffff00; white-space: nowrap; animation: fadeUp 2s forwards;
            pointer-events: none; z-index: 1000;
        }
        @keyframes fadeUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="config-group">
        <h3 style="color: #9146ff; text-align: center; margin: 0 0 15px 0;">Race Config</h3>
        <div class="config-item"><label>Twitch チャンネル ID</label><input type="text" id="channel-input"></div>
        <div class="config-item"><label>初期所持金 (円)</label><input type="number" id="initial-money-input" value="100000"></div>
        <div class="config-row">
            <div class="config-item"><label>1着賞金</label><input type="number" id="prize1-input" value="50000"></div>
            <div class="config-item"><label>初期プール</label><input type="number" id="pool-input" value="30000"></div>
        </div>
        <div class="config-row">
            <div class="config-item"><label>2着賞金</label><input type="number" id="prize2-input" value="20000"></div>
            <div class="config-item"><label>待機時間</label><input type="number" id="wait-input" value="300"></div>
        </div>
        <div class="config-row">
            <div class="config-item"><label>3着賞金</label><input type="number" id="prize3-input" value="10000"></div>
            <div class="config-item">
                <label>高度な設定</label>
                <div class="config-checkbox-row">
                    <input type="checkbox" id="multi-entry-input"> <span>同一ユーザの複数馬参加</span>
                </div>
            </div>
        </div>
        <button onclick="startConnection()">設定を保存して開始</button>
    </div>
</div>

<div id="sidebar">
    <h4 style="margin:0 0 5px 0; font-size: 14px;">所持金ランキング</h4>
    <div id="user-list-container">
        <div id="user-list"></div>
    </div>
    <div id="controls-info">
        <strong>【ルール】</strong><br>
        <span style="color:#00ff00">!race</span> : 参加(1万/16頭迄)<br>
        <span style="color:#ffaa00">!vote 枠</span> : 投票(最大3枚)<br>
        <span style="color:#00ffff">!start</span> : 即開始<br>
        <hr style="border:0; border-top:1px solid #555; margin: 5px 0;">
        <span style="color:#ffcc00;">★参加者は1枚目のみ無料！</span><br>
        (2枚目・3枚目は各1万必要)
    </div>
</div>

<div id="main">
    <div style="padding:10px; background: rgba(0,0,0,0.6);">
        <div id="twitch-status" style="font-size:11px; color:#aaa;">接続待機中...</div>
        <div id="timer-display"></div>
        <div id="live-rank">順位: 待機中</div>
        <div id="odds-display"></div>
    </div>
    
    <div id="waiting-area">
        <div class="waku-slot" id="ws-1"><div class="waku-header waku-bg-1">1枠</div><div class="waku-odds-info" id="odds-1">-</div></div>
        <div class="waku-slot" id="ws-2"><div class="waku-header waku-bg-2">2枠</div><div class="waku-odds-info" id="odds-2">-</div></div>
        <div class="waku-slot" id="ws-3"><div class="waku-header waku-bg-3">3枠</div><div class="waku-odds-info" id="odds-3">-</div></div>
        <div class="waku-slot" id="ws-4"><div class="waku-header waku-bg-4">4枠</div><div class="waku-odds-info" id="odds-4">-</div></div>
        <div class="waku-slot" id="ws-5"><div class="waku-header waku-bg-5">5枠</div><div class="waku-odds-info" id="odds-5">-</div></div>
        <div class="waku-slot" id="ws-6"><div class="waku-header waku-bg-6">6枠</div><div class="waku-odds-info" id="odds-6">-</div></div>
        <div class="waku-slot" id="ws-7"><div class="waku-header waku-bg-7">7枠</div><div class="waku-odds-info" id="odds-7">-</div></div>
        <div class="waku-slot" id="ws-8"><div class="waku-header waku-bg-8">8枠</div><div class="waku-odds-info" id="odds-8">-</div></div>
    </div>

    <div id="track">
        <div class="finish-line"></div>
        <div id="lanes-container"></div>
        
        <div id="denko-board">
            <div style="color: #fff; font-size: 11px; margin-bottom: 5px; border-bottom: 1px solid #fff;">確定 - RESULT</div>
            <div id="result-1" class="led-row"></div>
            <div id="result-2" class="led-row"></div>
            <div id="result-3" class="led-row"></div>
            <div id="payout-list"></div>
        </div>
    </div>
</div>

<script>
    let MY_CHANNEL = "";
    let INITIAL_MONEY = 100000;
    const ENTRY_FEE = 10000;
    const VOTE_FEE = 10000;
    const VOTE_UNIT = 1000; 
    let PRIZE_1 = 50000, PRIZE_2 = 20000, PRIZE_3 = 10000;
    let TOTAL_DUMMY_MONEY = 30000, WAIT_TIME = 300;
    let ALLOW_MULTIPLE_ENTRY = false;
    let users = {}, participants = [], votes = {};
    let dummyVoteCounts = Array(9).fill(0);
    let gameState = 'WAITING', timeLeft = 300, timerInterval = null, availableSlots = [];

    const CPU_NAMES = ["シルバーシップ", "ナツウララ", "チープインパクト", "ホッカイテイオー", "オグリキップ", "サイレンススズキ", "メグロマックイーン", "パンシャワー"];
    const WAKU_COLORS = ["#ffffff", "#222222", "#ff0000", "#0080ff", "#ffff00", "#008000", "#ff8c00", "#ffc0cb"];

    function startConnection() {
        const input = document.getElementById('channel-input').value.trim();
        if (!input) return;
        MY_CHANNEL = input.toLowerCase();
        INITIAL_MONEY = parseInt(document.getElementById('initial-money-input').value) || 0;
        PRIZE_1 = parseInt(document.getElementById('prize1-input').value) || 0;
        PRIZE_2 = parseInt(document.getElementById('prize2-input').value) || 0;
        PRIZE_3 = parseInt(document.getElementById('prize3-input').value) || 0;
        TOTAL_DUMMY_MONEY = parseInt(document.getElementById('pool-input').value) || 0;
        WAIT_TIME = parseInt(document.getElementById('wait-input').value) || 300;
        ALLOW_MULTIPLE_ENTRY = document.getElementById('multi-entry-input').checked;
        connect();
    }

    function generateHorseDataURL(color) {
        const canvas = document.createElement('canvas');
        canvas.width = 8; canvas.height = 8;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color;
        ctx.fillRect(1, 3, 5, 3); ctx.fillRect(4, 1, 3, 3);
        ctx.fillRect(1, 6, 1, 2); ctx.fillRect(5, 6, 1, 2);
        ctx.fillStyle = '#000'; ctx.fillRect(6, 1, 1, 1);
        return canvas.toDataURL();
    }

    function updateSidebar() {
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        Object.keys(users).sort((a,b) => users[b].money - users[a].money).forEach(name => {
            const div = document.createElement('div');
            div.className = "user-row";
            let voteHtml = "";
            if (votes[name] && votes[name].length > 0) {
                votes[name].forEach(waku => {
                    voteHtml += `<span class="vote-tag waku-bg-${waku}">${waku}</span>`;
                });
            }
            div.innerHTML = `
                <div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                    <b>${name}</b>${voteHtml}
                </div>
                <span style="color:#0f0; margin-left:5px;">${users[name].money.toLocaleString()}円</span>
            `;
            list.appendChild(div);
        });
    }

    function initRace() {
        participants = []; votes = {}; dummyVoteCounts = Array(9).fill(0);
        gameState = 'WAITING'; timeLeft = WAIT_TIME;
        for(let i=1; i<=8; i++) dummyVoteCounts[i] = 1;
        let rem = (TOTAL_DUMMY_MONEY / VOTE_UNIT) - 8;
        if(rem > 0) for(let j=0; j < rem; j++) dummyVoteCounts[Math.floor(Math.random() * 8) + 1]++;
        
        // 枠順ロジック：1〜8頭目バラバラ、9頭目〜もバラバラに埋める
        let firstSet = [1,2,3,4,5,6,7,8].sort(() => Math.random() - 0.5);
        let secondSet = [1,2,3,4,5,6,7,8].sort(() => Math.random() - 0.5);
        availableSlots = firstSet.concat(secondSet);

        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('denko-board').style.display = 'none';
        document.getElementById('lanes-container').innerHTML = '';
        document.getElementById('waiting-area').style.display = 'grid';
        document.getElementById('live-rank').innerText = "順位: 待機中";
        for(let i=1; i<=8; i++) {
            const ws = document.getElementById('ws-'+i);
            const head = ws.querySelector('.waku-header');
            const odds = ws.querySelector('.waku-odds-info');
            ws.innerHTML = ''; 
            ws.appendChild(head);
            ws.appendChild(odds);
        }
        updateOdds(); updateSidebar(); startCountdown();
    }

    function startCountdown() {
        timerInterval = setInterval(() => {
            if (gameState !== 'WAITING') return;
            timeLeft--;
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            document.getElementById('timer-display').innerText = `出走まで ${min}:${sec.toString().padStart(2,'0')} (参加:${participants.length}頭)`;
            if (timeLeft <= 0) startRaceProcess();
        }, 1000);
    }

    function startRaceProcess() {
        if (gameState !== 'WAITING') return;
        clearInterval(timerInterval);
        for(let w=1; w<=8; w++) {
            if (!participants.some(p => p.waku === w)) {
                participants.push({ 
                    name: CPU_NAMES[w-1], isCPU: true, waku: w,
                    speedMult: 1.0, events: { start: false, mid: false, last: false, end: false },
                    isGoodStartActive: false
                });
            }
        }
        runRace();
    }

    function runRace() {
        gameState = 'RACING';
        updateOdds();
        document.getElementById('waiting-area').style.display = 'none';
        const container = document.getElementById('lanes-container');
        participants.sort((a,b) => a.waku - b.waku).forEach((p, i) => {
            const lane = document.createElement('div');
            lane.className = 'lane';
            lane.innerHTML = `<div class="horse-container" id="h-${i}"><img class="horse-sprite" src="${generateHorseDataURL(WAKU_COLORS[p.waku-1])}"><div class="horse-name waku-bg-${p.waku}">${p.name}</div></div>`;
            container.appendChild(lane);
            p.pos = 0; p.fin = false;
        });

        const goal = document.getElementById('track').offsetWidth - 80;
        let winners = [];
        const loop = setInterval(() => {
            const leadPos = Math.max(...participants.map(p => p.pos));

            participants.forEach((p, i) => {
                if (!p.fin) {
                    const progress = p.pos / goal;
                    const leadProgress = leadPos / goal;

                    // --- イベント判定 ---
                    const triggerEvent = (text, newMult) => {
                        p.speedMult *= newMult;
                        const el = document.getElementById(`h-${i}`);
                        const msg = document.createElement('div');
                        msg.className = 'event-pop';
                        msg.innerText = text;
                        el.appendChild(msg);
                    };

                    // 1. 好スタート (10%地点まで限定、倍率1.8)
                    if (!p.events.start && progress < 0.1) {
                        p.events.start = true;
                        if (Math.random() < 0.05) {
                            p.isGoodStartActive = true;
                            triggerEvent("好スタート!", 1.8);
                        }
                    }
                    // 10%を超えたら好スタートの効果を消す
                    if (p.isGoodStartActive && progress >= 0.1) {
                        p.isGoodStartActive = false;
                        p.speedMult /= 1.8;
                    }

                    if (!p.events.mid && progress >= 0.5) {
                        p.events.mid = true;
                        if (Math.random() < 0.05) triggerEvent("スタミナ切れ…", 0.8);
                    }
                    if (!p.events.last && leadProgress >= 0.9) {
                        p.events.last = true;
                        if (Math.random() < 0.05) triggerEvent("スパート!", 1.2);
                    }
                    if (!p.events.end && progress >= 0.9) {
                        p.events.end = true;
                        if (Math.random() < 0.05) triggerEvent("バテた…", 0.7);
                    }

                    // --- 移動 ---
                    p.pos += (Math.random() * 2.5 + 0.8) * p.speedMult;
                    const el = document.getElementById(`h-${i}`);
                    el.style.left = (p.pos - 120) + "px"; 
                    if (p.pos >= goal) { p.fin = true; winners.push(p); }
                }
            });

            // リアルタイム順位計算（ゴールした馬を優先）
            let currentRanks = [
                ...winners,
                ...participants
                    .filter(p => !p.fin)
                    .sort((a, b) => b.pos - a.pos)
            ];

            let rankText = "順位: ";
            for(let k=0; k<5; k++) if(currentRanks[k]) rankText += `<span class="rank-tag">${k+1}位</span>${currentRanks[k].name} `;
            document.getElementById('live-rank').innerHTML = rankText;

            if (winners.length >= participants.length) { clearInterval(loop); finalizeRace(winners); }
        }, 40);
    }

    function finalizeRace(winners) {
        gameState = 'FINISHED';
        document.getElementById('denko-board').style.display = 'block';
        const [top, sec, thi] = winners;
        const setRow = (elId, label, horse, prize) => {
            const row = document.getElementById(elId);
            row.innerHTML = `<div class="led-res-text"><span style=\"width:35px\">${label}:</span><span class=\"waku-small-badge waku-bg-${horse.waku}\">${horse.waku}</span><span>${horse.name}</span></div><span class=\"led-prize\">+${prize.toLocaleString()}円</span>`;
        };
        setRow('result-1', '1着', top, PRIZE_1);
        setRow('result-2', '2着', sec, PRIZE_2);
        setRow('result-3', '3着', thi, PRIZE_3);

        if (!top.isCPU) users[top.name].money += PRIZE_1;
        if (sec && !sec.isCPU) users[sec.name].money += PRIZE_2;
        if (thi && !thi.isCPU) users[thi.name].money += PRIZE_3;

        const winWaku = top.waku;
        const userUnits = (VOTE_FEE/VOTE_UNIT);
        let totalU = 0; Object.values(votes).forEach(v => totalU += v.length);
        const pool = ((totalU * userUnits) + (TOTAL_DUMMY_MONEY/VOTE_UNIT)) * VOTE_UNIT;
        let winnersList = [], winningTix = 0;
        Object.keys(votes).forEach(n => {
            let c = votes[n].filter(v => v === winWaku).length;
            if(c>0) { winningTix += c; winnersList.push({n, c}); }
        });

        const totalWinningVotes = (winningTix * userUnits) + dummyVoteCounts[winWaku];
        let pHTML = "配当確定：<br>";
        if (totalWinningVotes > 0 && winnersList.length > 0) {
            const div = Math.floor(pool / totalWinningVotes);
            winnersList.forEach(w => {
                const pay = div * (w.c * userUnits);
                users[w.n].money += pay;
                pHTML += `${w.n}: +${pay.toLocaleString()}円<br>`;
            });
        } else pHTML += "的中なし";
        document.getElementById('payout-list').innerHTML = pHTML;
        updateSidebar();
        setTimeout(() => { initRace(); }, 12000);
    }

    function updateOdds() {
        const counts = [...dummyVoteCounts];
        const units = (VOTE_FEE/VOTE_UNIT);
        Object.values(votes).forEach(vArr => vArr.forEach(v => counts[v] += units));
        let totalU = 0; Object.values(votes).forEach(v => totalU += v.length);
        const currentPool = (totalU * units) + (TOTAL_DUMMY_MONEY/VOTE_UNIT);
        for(let i=1; i<=8; i++) {
            let o = (gameState === 'WAITING') 
                ? ( (currentPool + units) / (counts[i] + units) ).toFixed(1)
                : (currentPool / (counts[i] || 1)).toFixed(1);
            const oddsEl = document.getElementById(`odds-${i}`);
            if(oddsEl) oddsEl.innerText = o + "倍";
        }
    }

    function handleChat(name, msg) {
        if (!users[name]) users[name] = { money: INITIAL_MONEY };
        const cmd = msg.toLowerCase();
        if (cmd === '!start' && gameState === 'WAITING') startRaceProcess();
        
        if (cmd === '!race' && gameState === 'WAITING' && participants.length < 16) {
            const alreadyIn = participants.find(p => p.name === name);
            if ((!alreadyIn || ALLOW_MULTIPLE_ENTRY) && users[name].money >= ENTRY_FEE) {
                users[name].money -= ENTRY_FEE;
                const slot = availableSlots.shift();
                participants.push({ 
                    name, isCPU: false, waku: slot,
                    speedMult: 1.0, events: { start: false, mid: false, last: false, end: false },
                    isGoodStartActive: false
                });
                const ws = document.getElementById('ws-' + slot);
                const unit = document.createElement('div');
                unit.className = 'waiting-unit';
                unit.innerHTML = `<div class="waiting-name">${name}</div><img class="horse-sprite" src="${generateHorseDataURL(WAKU_COLORS[slot-1])}">`;
                ws.appendChild(unit);
                updateSidebar();
            }
        }
        if (cmd.startsWith('!vote') && gameState === 'WAITING') {
            const w = parseInt(cmd.split(' ')[1]);
            if (w >= 1 && w <= 8) {
                if (!votes[name]) votes[name] = [];
                if (votes[name].length < 3 && !votes[name].includes(w)) {
                    const isP = participants.some(p => p.name === name);
                    if (isP && votes[name].length === 0) votes[name].push(w);
                    else if (users[name].money >= VOTE_FEE) { users[name].money -= VOTE_FEE; votes[name].push(w); }
                    updateOdds(); updateSidebar();
                }
            }
        }
    }

    function connect() {
        const socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
        socket.onopen = () => {
            socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
            socket.send('PASS SCHMOOPIIE');
            socket.send('NICK justinfan' + Math.floor(Math.random() * 10000));
            socket.send('JOIN #' + MY_CHANNEL);
        };
        socket.onmessage = (e) => {
            const raw = e.data;
            if (raw.includes('PING')) socket.send('PONG :tmi.twitch.tv');
            if (raw.includes(' 001 ')) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main').style.display = 'block';
                document.getElementById('twitch-status').innerText = `● Twitch: ${MY_CHANNEL}`;
                initRace();
            }
            if (raw.includes('PRIVMSG')) {
                const parts = raw.split(';');
                let displayName = "Player";
                parts.forEach(p => { if (p.startsWith('display-name=')) displayName = p.split('=')[1]; });
                const msgPart = raw.split('PRIVMSG #' + MY_CHANNEL + ' :')[1];
                if (msgPart) handleChat(displayName, msgPart.trim());
            }
        };
    }
</script>
</body>
